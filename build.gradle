buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

apply plugin: 'org.spongepowered.mixin'

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    // マッピングは gradle.properties の mapping_channel / mapping_version で指定する。
    mappings channel: mapping_channel, version: mapping_version

    // IDE 出力先へリソースを事前配置（runClient の動作に必須）。
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            // Mixin refmap を開発環境でも remap する
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

// 必須のバニラ向けMixin。互換系は下の compat_*（各MOD導入時のみ作用、required=false）。
mixin {
    add sourceSets.main, "topdown_view.refmap.json"
    config "topdown_view.mixins.json"
    config "topdown_view_compat.mixins.json"
    config "topdown_view_compat_btp.mixins.json"
    config "topdown_view_compat_tacz.mixins.json"
    config "topdown_view_compat_oculus.mixins.json"
    config "topdown_view_compat_bc.mixins.json"
    config "topdown_view_compat_dh.mixins.json"
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        url = 'https://maven.architectury.dev/'
    }
    // libs/ のローカルJAR（各MOD）を解決する
    flatDir {
        dir 'libs'
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // 互換MOD（libs/ のローカルJAR。compileOnly のため本番JARには含まれない）
    compileOnly fg.deobf("blank:embeddium:${embeddium_version}")
    compileOnly fg.deobf("blank:oculus-mc1.20.1:${oculus_version}")
    compileOnly files('libs/BetterThirdPerson-Forge-1.20-1.9.0.jar')
    compileOnly fg.deobf("blank:mobends-1.20.1:${mobends_version}")
    compileOnly fg.deobf("blank:soundphysics:${soundphysics_version}")

    // 開発run専用MOD（本番JARには含まれない）
    runtimeOnly fg.deobf("blank:embeddium:${embeddium_version}")
    runtimeOnly fg.deobf("blank:oculus-mc1.20.1:${oculus_version}")
    runtimeOnly fg.deobf("blank:soundphysics:${soundphysics_version}")
    runtimeOnly fg.deobf("blank:libraryferret:${libraryferret_version}")
    runtimeOnly fg.deobf("blank:bettervillage:${bettervillage_version}")
    runtimeOnly fg.deobf("dev.architectury:architectury-forge:${architectury_version}")
}

// mods.toml / pack.mcmeta の ${...} を gradle.properties の値で置換する。
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version    : minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version        : forge_version, forge_version_range: forge_version_range,
            loader_version_range : loader_version_range,
            mod_id               : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors          : mod_authors, mod_description: mod_description,
            oculus_version_range : oculus_version_range,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    // 開発用MODのダミークラスを本番JARから除外する
    exclude 'org/embeddedt/**'
    exclude 'me/jellysquid/**'

    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
